name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      # The API reference is generated from these, so a source change can make it stale.
      - 'GearsAPI/Source/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci

      # Fails if GearsAPI/Source has changed without regenerating the reference, or if any
      # internal doc link is dangling.
      - name: Check generated reference and links
        run: npm run check

      - run: npm run build

      # `_next/` starts with an underscore; harmless with the Actions deploy, kept as insurance.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
